<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de matrículas | Forca & Fitness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/header.css">
    <style>
        .permanencia-box {
            display: inline-block;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            font-weight: 600;
            padding: 0.55rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
        }
        .badge-tipo {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            background: #f1f5f9;
            color: #334155;
        }
        .badge-tipo.reserva {
            background: #f5f3ff;
            border-color: #ddd6fe;
            color: #6d28d9;
        }
    </style>
</head>
<body data-menu="/alumnos.html">
    <header id="app-header"></header>

    <main class="container" style="max-width: 1200px;">
        <section class="page-header">
            <a href="/alumnos.html" class="btn-link" id="btn-volver">← Volver a alumnos</a>
            <h2 class="title" style="margin-top: 0.5rem;">Historial de matrículas</h2>
            <p class="description" id="alumno-nombre">Cargando alumno...</p>
        </section>

        <div id="permanencia" class="permanencia-box" style="display: none;" role="status"></div>

        <div class="table-container">
            <table class="alumnos-table">
                <thead>
                    <tr>
                        <th>Disciplina</th>
                        <th>Horario</th>
                        <th>Fecha de inicio</th>
                        <th>Fecha de fin</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="historial-tbody">
                    <tr>
                        <td colspan="6" class="text-center text-muted">Cargando historial...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/historial-matriculas.js"></script>
</body>
</html>
