<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Clases | Forca & Fitness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="/css/header.css">
</head>
<body data-allow-guest="true" data-menu="/disciplinas.html">

    <!-- Header -->
    <header id="app-header"></header>

    <!-- Main Container -->
    <main class="container">
        
        <!-- Page Header -->
        <section class="page-header">
            <p class="subtitle" style="font-weight: 700; color: var(--text-muted); letter-spacing: 1px; font-size: 0.8rem; text-transform: uppercase;">CONSULTA DE CLASES</p>
            <h2 class="title">Horarios y disponibilidad</h2>
            <p class="description">Revisa los horarios y cupos disponibles por disciplina.</p>
        </section>

        <!-- Form Card -->
        <div class="form-card">
            
            <div class="filtros-header">
                <div class="filtros-texto">
                    <h3>Disponibilidad por disciplina</h3>
                    <p>Selecciona una disciplina para consultar sus horarios y cupos actuales.</p>
                </div>
                
                <div class="disciplina-selector form-group">
                    <label for="disciplina-select">Disciplina</label>
                    <select id="disciplina-select">
                        <option value="">Seleccione...</option>
                    </select>
                </div>
            </div>

            <hr class="divider">

            <!-- Grilla de Horarios -->
            <div id="horarios-grid" class="horarios-grid">
                <div class="text-muted" style="text-align: center; padding: 2rem;">Cargando horarios...</div>
            </div>
            
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/disciplinas.js"></script>
</body>
</html>
