<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnos registrados | Forca & Fitness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Header General (Simulado de Menú Principal) -->
    <header class="header">
        <div class="logo">
            <img src="/images/logo.png" alt="Forca & Fitness Logo" class="logo-img">
            <h1>Portal Forca&Fitness</h1>
        </div>
        
        <div class="header-right" style="display: flex; align-items: center; gap: 2.5rem;">
            <!-- Menú superior -->
            <nav class="top-nav">
                <a href="/alumnos.html" class="active">Alumnos</a>
                <a href="/index.html">Matrículas</a>
                <a href="#">Pagos</a>
            </nav>

            <div class="user-info">
                <div class="user-details">
                    <span class="user-name">Paul Bryan Rafael Yepez</span>
                    <span class="user-role">Tesorero</span>
                </div>
                <a href="#" class="logout-btn">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 1200px;">
        <div class="page-header">
            <h2 class="title">Alumnos registrados</h2>
            <p class="description">Consulta los alumnos que forman parte de Forca & Fitness.</p>
        </div>

        <!-- Toolbar / Search -->
        <div class="alumnos-toolbar">
            <input type="text" class="search-input" placeholder="🔍 Buscar por nombre">
            <div class="filter-group">
                <label>Estado</label>
                <select class="filter-select">
                    <option>Todos</option>
                    <option>Activo</option>
                    <option>Inactivo</option>
                </select>
            </div>
        </div>

        <!-- Tabla principal -->
        <div class="table-container">
            <table class="alumnos-table">
                <thead>
                    <tr>
                        <th>Alumno</th>
                        <th>Estado de matrícula</th>
                        <th class="text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="alumnos-tbody">
                    <tr>
                        <td colspan="3" class="text-center text-muted">Cargando alumnos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- PANEL LATERAL (SIDE DRAWER) T_20 -->
    <div class="side-panel-overlay" id="side-panel-overlay"></div>
    <aside class="side-panel" id="side-panel">
        <div class="side-panel-header">
            <h3>DETALLE DEL ALUMNO</h3>
            <button class="btn-close" id="btn-close-panel">✕</button>
        </div>
        
        <div class="side-panel-content" id="side-panel-content">
            <div class="text-center text-muted mt-4">Cargando información...</div>
        </div>
    </aside>

    <script src="/js/alumnos.js"></script>
</body>
</html>
