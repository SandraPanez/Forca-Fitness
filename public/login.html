<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Forca&Fitness</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

<div class="login-page">

    <!-- LADO IZQUIERDO -->
    <section class="login-visual">

        <div class="login-brand">
            <img src="/images/logo.png" alt="Forca&Fitness">
            <span>Portal Forca&Fitness</span>
        </div>

        <div class="login-welcome">
            <h1>Bienvenido al Portal<br>Forca&Fitness</h1>
            <p>
                Inicia sesión para continuar o regístrate para comenzar
                tu matrícula.
            </p>
        </div>

    </section>

    <!-- LADO DERECHO -->
    <section class="login-form-side">

        <div class="login-content">

            <p class="login-eyebrow">BIENVENIDO AL</p>

            <h2>Portal Forca&Fitness</h2>

            <p class="login-subtitle">
                Accede a tu cuenta o crea una para empezar.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>

                    <input
                        type="email"
                        id="correo"
                        class="input-control"
                        placeholder="correo@ejemplo.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            class="input-control"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Mostrar contraseña"
                        >
                            ◉
                        </button>

                    </div>
                </div>

                <p id="login-error" class="login-error"></p>

                <button type="submit" class="login-button">
                    Iniciar sesión
                </button>

            </form>

            <a href="#" class="forgot-link">
                ¿Olvidaste tu contraseña?
            </a>

            <div class="login-divider">
                <span>o</span>
            </div>

            <a href="/index.html" class="register-button">
                Registrarte
            </a>

            <div class="login-footer">
                Forca & Fitness
            </div>

        </div>

    </section>

</div>

<script src="/js/login.js"></script>

</body>
</html>
