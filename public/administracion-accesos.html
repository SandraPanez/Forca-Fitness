<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de accesos | Forca & Fitness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/header.css">
</head>
<body>
    <header id="app-header"></header>

    <main class="container" style="max-width: 1200px;">
        <div class="page-header">
            <h2 class="title">Administración de accesos</h2>
            <p class="description">Consulta el personal operativo de la academia (tesoreros y profesores) y el rol asignado a cada persona.</p>
        </div>

        <div class="personal-toolbar">
            <button type="button" class="btn-submit" id="btn-agregar-personal">Agregar personal</button>
        </div>

        <div class="table-container">
            <table class="alumnos-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Rol</th>
                        <th class="text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="personal-tbody">
                    <tr><td colspan="3" class="text-center text-muted">Cargando personal...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Ventana de registro de nuevo personal -->
    <div class="modal-overlay" id="registroModal" role="dialog" aria-modal="true" aria-labelledby="registro-titulo">
        <form class="modal modal-form" id="registroForm" novalidate>
            <h3 id="registro-titulo">Agregar personal</h3>

            <div class="grid-2-cols">
                <div class="form-group">
                    <label for="registro-nombres">Nombres <span class="asterisk">*</span></label>
                    <input type="text" id="registro-nombres" name="nombres" placeholder="Ej: Juan" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="registro-apellido-paterno">Apellido paterno <span class="asterisk">*</span></label>
                    <input type="text" id="registro-apellido-paterno" name="apellido_paterno" placeholder="Ej: Rondón" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="registro-apellido-materno">Apellido materno <span class="asterisk">*</span></label>
                    <input type="text" id="registro-apellido-materno" name="apellido_materno" placeholder="Ej: Pujay" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="registro-dni">DNI <span class="asterisk">*</span></label>
                    <input type="text" id="registro-dni" name="numero_documento" placeholder="Ej: 74628153" inputmode="numeric" maxlength="8" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="registro-correo">Correo electrónico <span class="asterisk">*</span></label>
                    <input type="email" id="registro-correo" name="correo_electronico" placeholder="Ej: nombre.apellido@forcafitness.com" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="registro-celular">Número de celular <span class="asterisk">*</span></label>
                    <input type="tel" id="registro-celular" name="numero_celular" placeholder="Ej: 987654321" inputmode="numeric" maxlength="9" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="registro-password">Contraseña temporal <span class="asterisk">*</span></label>
                    <input type="password" id="registro-password" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                </div>
            </div>

            <fieldset class="roles-fieldset">
                <legend>Rol <span class="asterisk">*</span> <small>(puedes elegir más de uno)</small></legend>
                <div class="roles-opciones">
                    <label class="disciplina-card">
                        <div class="disciplina-info">
                            <span class="disciplina-name">Profesor</span>
                            <span class="disciplina-desc">Control de acceso y alumnos de sus disciplinas</span>
                        </div>
                        <input type="checkbox" name="roles" value="PROFESOR">
                    </label>
                    <label class="disciplina-card">
                        <div class="disciplina-info">
                            <span class="disciplina-name">Tesorero</span>
                            <span class="disciplina-desc">Alumnos y gestión de pagos</span>
                        </div>
                        <input type="checkbox" name="roles" value="TESORERO">
                    </label>
                </div>
            </fieldset>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="btn-cancelar-registro">Cancelar</button>
                <button type="submit" class="btn-submit">Registrar</button>
            </div>
        </form>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/administracion-accesos.js"></script>
</body>
</html>
