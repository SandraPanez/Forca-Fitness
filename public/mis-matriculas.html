<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis matrículas | Forca & Fitness</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/header.css">
</head>

<body>

    <header id="app-header"></header>

    <main class="container" style="max-width: 1200px;">

        <section class="page-header">
            <h2 class="title">Mis matrículas</h2>
            <p class="description">
                Consulta la vigencia y fecha de vencimiento de tus disciplinas.
            </p>
        </section>

        <div id="pago-pendiente-banner" class="login-success" style="display: none;" role="status">
            Tu solicitud de pago en efectivo fue registrada. El tesorero confirmará el pago y tu matrícula se activará al aprobarse.
        </div>

        <div class="table-container">
            <table class="alumnos-table">
                <thead>
                    <tr>
                        <th>Disciplina</th>
                        <th>Fecha de inicio</th>
                        <th>Fecha de vencimiento</th>
                        <th>Estado</th>
                    </tr>
                </thead>

                <tbody id="mis-matriculas-tbody">
                    <tr>
                        <td colspan="4" class="text-center text-muted">
                            Cargando matrículas...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <div class="modal-overlay" id="modal-renovar" role="dialog" aria-modal="true" aria-labelledby="modal-renovar-titulo">
        <div class="modal">
            <h3 id="modal-renovar-titulo">Renovar matrícula</h3>
            <p id="modal-renovar-detalle"></p>
            <p id="modal-renovar-error" class="error-message" role="alert" style="display: none;"></p>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="modal-renovar-cancelar">Cancelar</button>
                <button type="button" class="btn-submit" id="modal-renovar-continuar">Continuar al pago</button>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/mis-matriculas.js"></script>

</body>
</html>
